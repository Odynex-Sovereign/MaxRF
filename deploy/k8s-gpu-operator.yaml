apiVersion: v1
kind: Namespace
metadata:
  name: nvidia-gpu-operator
---
apiVersion: ://coreos.com
kind: Subscription
metadata:
  name: nvidia-gpu-operator-subscription
  namespace: nvidia-gpu-operator
spec:
  channel: stable
  name: nvidia-gpu-operator
  source: nvidia-operator-catalog
  sourceNamespace: olm
---
apiVersion: ://nvidia.com
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
spec:
  operator:
    defaultRuntime: crio
  driver:
    enabled: true
    use_container_toolkit: true
  devicePlugin:
    enabled: true
    args: ["--pass-device-specs"]
  dcgmExporter:
    enabled: true # Exposes GPU yield and performance tracking to the homeowner dashboard
  nodeStatusExporter:
    enabled: true
