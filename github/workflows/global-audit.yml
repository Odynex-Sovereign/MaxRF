name: Global Regulatory Audit Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit-compliance-matrix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Run Schema Structural Validation
      run: |
        # Verifies that regional overrides are cleanly defined and structured correctly
        if grep -q "strict_containment" config/sovereign_cloud.yaml; then
          echo "Sovereignty containment declarations present. Local compliance validated."
        else
          echo "ERROR: Critical structural data isolation protocols missing from matrix configuration!" && exit 1fi
